# opt.spec.yaml — PER-DESIGN config. Copy one into each block you optimize:
#   ip_digital/alu/fpu_top/opt.spec.yaml
# The shared engine (scripts/rtl_opt/) reads this. Flat "key: value" only.

# --- which block (matches pillar.py's --top / --ip-path) ---
top:        fpu_top
ip_path:    ip_digital/alu/fpu_top

# --- how THIS block builds/verifies. Tools are NATIVE (no Docker).
#     pillar.py writes ip_path/build/.pillar_result_<step>.json itself (no --json flag).
#     Use .venv/bin/python3 if a .core fileset needs PyYAML; system python3 is fine otherwise.
flow_cmd:   "python3 scripts/pillar.py --top fpu_top --ip-path ip_digital/alu/fpu_top --step all"

# --- targets (what "converged" means). TT corner is the sign-off point. ---
target_wns_ns:   0.40       # TT worst-slack goal (baseline +0.192). SS stays advisory.
max_cells:       1200        # cell-count ceiling (synth.total_cells; OSS has no µm² area)

# --- acceptance tolerances ---
wns_eps_ns:      0.005      # min slack gain to count an edit as a timing improvement
cells_tol:       0.02       # allow <=2% more cells when buying timing
cells_eps:       0.005      # min cell shrink to accept in the area phase

# --- loop budgets (loop self-stops on any of these) ---
max_iters:       40
max_rejects:     8
max_wall_min:    180
